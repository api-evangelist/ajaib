agent_cautions:
- No idempotency key is documented. An agent that retries create_order or create_batch_orders after a
  timeout may place duplicate orders against real funds.
- A 200 on an order write means the exchange received the instruction, not that it executed. Confirm with
  get_order before acting on the result.
- Signing is proprietary and per-request; an MCP server would need the client's ECDSA private key, which
  the docs say must never be shared.
