apis:
- aid: ajaib:coin-exchange
  name: Ajaib Coin Exchange API
  description: >-
    REST trading API for the Ajaib Coin Exchange (Ajaib Kripto). Provides market
    information (server time, exchange info, order book depth, latest price),
    wallet portfolio balances, and spot trading (view, place, batch and cancel
    orders and trades). All requests and responses are application/json;
    authenticated calls carry an issued API key plus an ECDSASHA256 request
    signature. A separate testnet base endpoint is published at
    https://api.ajaib.tech.
  humanURL: https://ajaib.gitbook.io/coin-exchange
  baseURL: https://api.ajaib.co.id
