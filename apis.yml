aid: ajaib
name: Ajaib
description: >-
  Ajaib is an Indonesian fintech and online brokerage founded in 2018 that gives
  retail investors access to Indonesian stocks, mutual funds, bonds, US stocks
  and crypto from a single mobile app. It operates PT Ajaib Sekuritas Asia for
  equities and Ajaib Kripto for digital assets, and became Southeast Asia's
  first investment unicorn in 2021. Its one public developer surface is the
  Ajaib Coin Exchange API, a REST trading interface for the crypto venue,
  documented on GitBook and organized into Market Info, Wallet and Spot Trading.
  Access is not self-service: clients generate an ECDSASHA256 keypair, email the
  public key to Ajaib, and sign every request with X-API-KEY, X-SIGNATURE and
  X-TIMESTAMP headers. Ajaib publishes no OpenAPI, no SDKs and no status page.
